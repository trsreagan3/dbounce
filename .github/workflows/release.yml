name: release

# Builds pre-compiled binaries + .deb + .rpm packages and attaches them to
# the GitHub Release when a v* tag is pushed.
#
# Formats produced (per [[automatic-bootstrap-must-just-work-everywhere]]):
#   - .tar.gz / .zip  → linux/darwin (CGO binary; windows skipped — see goreleaser config)
#   - .deb            → linux amd64 + arm64  (dpkg install)
#   - .rpm            → linux x86_64 + aarch64  (rpm install)
#   - docker          → ghcr.io/trsreagan3/dbounce linux/amd64 + linux/arm64
#   - brew            → trsreagan3/homebrew-tap formula
#   - scoop           → trsreagan3/scoop-bucket manifest
#
# CGO NOTE: dbounce uses pg_query_go (wraps libpg_query / C). windows
# cross-compile requires MinGW; skipped for v1.0. CGO_ENABLED=1 + musl
# static link is handled in .goreleaser.yaml.
#
# NOTE: artifacts are attached to GitHub Releases; they are NOT published
# to a public APT/RPM repo (that is follow-up post-v1.0 work).
# Per [[vendor-integration-claim-qualifier]]: "built + smoke-tested in CI;
# NOT published to public deb/rpm registry."
#
# TRIGGER POLICY:
#   push v* tag  → full release (builds + publishes all artifacts).
#                  DO NOT push a tag until launch readiness is confirmed.
#   workflow_dispatch (snapshot=true) → goreleaser build --snapshot --clean
#                  Builds all cross-platform binaries locally; NO publish.
#                  Safe to run any time to validate the matrix still builds.
#   workflow_dispatch (snapshot=false) → full release (same as tag push).
#
# PREREQUISITES before the first tagged release:
#   1. Create https://github.com/trsreagan3/homebrew-tap (public repo)
#      with a stub Formula/ directory.
#   2. Create https://github.com/trsreagan3/scoop-bucket (public repo)
#      with a stub bucket/ directory.
#   3. Add repo secret HOMEBREW_TAP_TOKEN: PAT with repo scope on homebrew-tap.
#   4. Add repo secret SCOOP_BUCKET_TOKEN: PAT with repo scope on scoop-bucket.
#   5. Confirm ghcr.io/trsreagan3/dbounce image visibility on GitHub Packages.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Run as snapshot (build only, no publish)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write    # create + upload GitHub Release
  packages: write    # push to ghcr.io
  id-token: write    # needed for attestation (future)

jobs:
  goreleaser:
    name: goreleaser — build + release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install CGO dependencies (libpg_query / musl static link)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential musl-dev musl-tools

      - name: Set up QEMU (for arm64 docker cross-build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.snapshot == 'false') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser (snapshot — build only, no publish)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.snapshot == 'true' }}
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser (full release — tag push or manual)
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.snapshot == 'false') }}
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # HOMEBREW_TAP_TOKEN: PAT with repo scope on trsreagan3/homebrew-tap.
          # The tap repo must exist before the first tagged release.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # SCOOP_BUCKET_TOKEN: PAT with repo scope on trsreagan3/scoop-bucket.
          # The bucket repo must exist before the first tagged release.
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}

  smoke-test-deb:
    name: smoke-test .deb on ubuntu:22.04
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Download .deb artifact (amd64)
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            });
            const asset = release.data.assets.find(a => a.name.includes('linux_amd64') && a.name.endsWith('.deb'));
            if (!asset) throw new Error('amd64 .deb not found in release assets');
            const fs = require('fs');
            const response = await github.rest.repos.getReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              asset_id: asset.id,
              headers: { Accept: 'application/octet-stream' },
            });
            fs.writeFileSync('dbounce.deb', Buffer.from(response.data));
            console.log('Downloaded:', asset.name);

      - name: Install + verify in ubuntu:22.04 container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/dbounce.deb:/tmp/dbounce.deb" \
            ubuntu:22.04 \
            bash -c "
              set -e
              apt-get update -qq
              dpkg -i /tmp/dbounce.deb
              dbounce --version
              dbounce --help | grep -i dbounce
              echo 'deb smoke-test PASSED'
            "

  smoke-test-rpm:
    name: smoke-test .rpm on fedora:40
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Download .rpm artifact (x86_64)
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            });
            const asset = release.data.assets.find(a => a.name.includes('linux_amd64') && a.name.endsWith('.rpm'));
            if (!asset) throw new Error('amd64 .rpm not found in release assets');
            const fs = require('fs');
            const response = await github.rest.repos.getReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              asset_id: asset.id,
              headers: { Accept: 'application/octet-stream' },
            });
            fs.writeFileSync('dbounce.rpm', Buffer.from(response.data));
            console.log('Downloaded:', asset.name);

      - name: Install + verify in fedora:40 container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/dbounce.rpm:/tmp/dbounce.rpm" \
            fedora:40 \
            bash -c "
              set -e
              rpm -i /tmp/dbounce.rpm
              dbounce --version
              dbounce --help | grep -i dbounce
              echo 'rpm smoke-test PASSED'
            "
