name: docker-publish

# Publishes ghcr.io/trsreagan3/dbounce on:
#   - push to main         → :main
#   - push of a v* git tag → :vX.Y.Z + :latest
#
# Image is a packaging convenience (per [[ibounce-honest-positioning]]) —
# same binary as `go install`. No telemetry. Multi-arch
# (linux/amd64 + linux/arm64). Distroless static base.

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Allow manual rebuilds (useful when the base image rolls a CVE fix).
  workflow_dispatch:

# Least-privilege: only need to read the repo + write to GHCR.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: trsreagan3/dbounce

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed so `git describe --tags --always` can stamp the
          # version into the binary via Docker build-args.
          fetch-depth: 0

      - name: Compute build metadata
        id: meta-vars
        run: |
          VERSION="$(git describe --tags --always --dirty)"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${COMMIT}"   >> "$GITHUB_OUTPUT"
          echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for arm64 builds on amd64 runners)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags + OCI labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Branch builds → :main
            type=ref,event=branch
            # Tag builds → :v1.2.3 and :1.2.3
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            # Tag builds also get :latest
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # ---- Smoke test (single-arch) before pushing multi-arch ----
      # Build linux/amd64 locally and run --version + --help to confirm
      # the entrypoint works under distroless (no shell). If this fails,
      # the multi-arch push never happens.
      - name: Smoke build (amd64, load to local daemon)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: dbounce:smoke
          build-args: |
            VERSION=${{ steps.meta-vars.outputs.version }}
            COMMIT=${{ steps.meta-vars.outputs.commit }}
            BUILD_TIME=${{ steps.meta-vars.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — --version
        run: docker run --rm dbounce:smoke --version

      - name: Smoke test — --help
        run: docker run --rm dbounce:smoke --help

      - name: Smoke test — image size report
        run: |
          docker images dbounce:smoke --format '{{.Repository}}:{{.Tag}} {{.Size}}'

      # ---- Real-deploy smoke (§A37) ---------------------------------------
      # The --version + --help smoke above only proves the binary STARTS.
      # It would NOT have caught flag-drift like §A33 (Helm chart's
      # --active-profile vs binary's --profile) if the binary changed.
      #
      # This step actually boots dbounce in a container, hits /healthz on
      # the management port, and asserts the SQLite audit DB was written
      # to a bind-mounted host directory. If `dbounce run` rejects a flag,
      # fails to bind, or never opens the store, this catches it before
      # the multi-arch push.
      #
      # Mirrors what an operator does locally — to run the same smoke on
      # a dev machine: copy the block under "RUN_LOCALLY" comments and
      # adjust the image tag to ghcr.io/trsreagan3/dbounce:latest.
      - name: Real-deploy smoke — boot + healthz + audit DB written
        run: |
          set -euo pipefail
          # RUN_LOCALLY: replace ${IMAGE} with ghcr.io/trsreagan3/dbounce:latest
          IMAGE=dbounce:smoke

          # Host dir that the container's UID 65532 must be able to
          # write. chown matches the README's "Bind-mounting volumes"
          # guidance.
          DATA_DIR="$(mktemp -d)/dbounce"
          mkdir -p "${DATA_DIR}"
          sudo chown 65532:65532 "${DATA_DIR}"

          # D-Slice 1 is OBSERVATION-ONLY (no --upstream needed); the
          # listener still binds + the management port still serves
          # /healthz, which is the boot-readiness signal we assert on.
          # Both ports bound to 0.0.0.0 so we can hit them from the host
          # — gated behind the threat-model acknowledgement flags.
          #
          # --audit-events-token is ALSO mandatory when --mgmt-host is
          # non-loopback (binding 0.0.0.0 inside the container is needed
          # so the docker bridge can forward host requests in). The smoke
          # isn't exercising /audit/events; we just need a value that
          # satisfies the gate. Random hex is fine for a throwaway run.
          SMOKE_TOKEN="$(openssl rand -hex 16)"
          docker run -d --name db-smoke \
            -p 15433:5433 \
            -p 18768:8768 \
            -v "${DATA_DIR}:/home/nonroot/.dbounce" \
            "${IMAGE}" \
            run \
              --host 0.0.0.0 \
              --port 5433 \
              --mgmt-host 0.0.0.0 \
              --mgmt-port 8768 \
              --i-know-this-binds-externally \
              --i-know-mgmt-binds-externally \
              --audit-events-token "${SMOKE_TOKEN}" \
              --mode cooperative

          # Wait for the mgmt port to come up + answer /healthz.
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18768/healthz >/dev/null 2>&1; then
              echo "dbounce /healthz answered after ${i}s"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "dbounce /healthz never answered; container logs:"
              docker logs db-smoke || true
              exit 1
            fi
            sleep 1
          done

          # /healthz is the canonical readiness check.
          curl -fsS http://127.0.0.1:18768/healthz | head -c 400
          echo

          # Assert the SQLite audit DB was opened + written to the
          # bind-mounted host directory. This is the core §A37 check:
          # if `dbounce run` accepted the flags but silently never opened
          # the store, the file won't exist. Existence on disk proves
          # the binary actually exercised its persistence path.
          if [ ! -f "${DATA_DIR}/state.db" ]; then
            echo "FAIL: ${DATA_DIR}/state.db not created — dbounce did not open the audit DB"
            ls -la "${DATA_DIR}"
            docker logs db-smoke || true
            exit 1
          fi
          echo "PASS: state.db created ($(stat -c%s "${DATA_DIR}/state.db") bytes)"

          # Cleanup. `|| true` so a stop failure doesn't mask the
          # assertion result above.
          docker stop db-smoke >/dev/null || true
          docker rm db-smoke >/dev/null || true
          rm -rf "${DATA_DIR}" || sudo rm -rf "${DATA_DIR}" || true

      # ---- Multi-arch build + push ----
      - name: Build and push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta-vars.outputs.version }}
            COMMIT=${{ steps.meta-vars.outputs.commit }}
            BUILD_TIME=${{ steps.meta-vars.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
